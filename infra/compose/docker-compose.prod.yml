services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fuxiaohe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fuxiaohe
    volumes:
      - fuxiaohe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuxiaohe -d fuxiaohe"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - fuxiaohe_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://fuxiaohe:${POSTGRES_PASSWORD}@postgres:5432/fuxiaohe
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      MOCK_LLM: ${MOCK_LLM:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_MODEL: ${EMBEDDING_API_MODEL:-}
      EMBEDDING_API_DIMENSIONS: ${EMBEDDING_API_DIMENSIONS:-0}
      EMBEDDING_API_TIMEOUT_SECONDS: ${EMBEDDING_API_TIMEOUT_SECONDS:-15}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  notification-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    command: ["python", "scripts/notification_worker.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://fuxiaohe:${POSTGRES_PASSWORD}@postgres:5432/fuxiaohe
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      MOCK_LLM: ${MOCK_LLM:-true}
    depends_on:
      api:
        condition: service_healthy

  sync-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    command: ["python", "scripts/sync_worker.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://fuxiaohe:${POSTGRES_PASSWORD}@postgres:5432/fuxiaohe
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web.prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  fuxiaohe_pgdata:
  fuxiaohe_redisdata:
