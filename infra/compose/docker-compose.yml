services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fuxiaohe
      POSTGRES_PASSWORD: fuxiaohe_dev
      POSTGRES_DB: fuxiaohe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuxiaohe"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fuxiaohe:fuxiaohe_dev@postgres:5432/fuxiaohe
      REDIS_URL: redis://redis:6379/0
      MOCK_LLM: ${MOCK_LLM:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_MODEL: ${EMBEDDING_API_MODEL:-}
      EMBEDDING_API_TIMEOUT_SECONDS: ${EMBEDDING_API_TIMEOUT_SECONDS:-15}
      EMBEDDING_API_DIMENSIONS: ${EMBEDDING_API_DIMENSIONS:-0}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      VERIFICATION_PROVIDER_URL: ${VERIFICATION_PROVIDER_URL:-}
      VERIFICATION_PROVIDER_API_KEY: ${VERIFICATION_PROVIDER_API_KEY:-}
      VERIFICATION_PROVIDER_WEBHOOK_SECRET: ${VERIFICATION_PROVIDER_WEBHOOK_SECRET:-}
      NOTIFICATION_PROVIDER_URL: ${NOTIFICATION_PROVIDER_URL:-}
      NOTIFICATION_PROVIDER_API_KEY: ${NOTIFICATION_PROVIDER_API_KEY:-}
      FEEDBACK_SCAN_URL: ${FEEDBACK_SCAN_URL:-}
      FEEDBACK_SCAN_API_KEY: ${FEEDBACK_SCAN_API_KEY:-}
      FEEDBACK_STORAGE_URL: ${FEEDBACK_STORAGE_URL:-}
      FEEDBACK_STORAGE_API_KEY: ${FEEDBACK_STORAGE_API_KEY:-}
      SYNC_PROVIDER_URL: ${SYNC_PROVIDER_URL:-}
      SYNC_PROVIDER_API_KEY: ${SYNC_PROVIDER_API_KEY:-}
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../services:/app/services
      - ../../packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "scripts/notification_worker.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://fuxiaohe:fuxiaohe_dev@postgres:5432/fuxiaohe
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      MOCK_LLM: ${MOCK_LLM:-true}
      NOTIFICATION_PROVIDER_URL: ${NOTIFICATION_PROVIDER_URL:-}
      NOTIFICATION_PROVIDER_API_KEY: ${NOTIFICATION_PROVIDER_API_KEY:-}
      NOTIFICATION_WORKER_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_INTERVAL_SECONDS:-60}
      VERIFICATION_PROVIDER_URL: ${VERIFICATION_PROVIDER_URL:-}
      VERIFICATION_PROVIDER_API_KEY: ${VERIFICATION_PROVIDER_API_KEY:-}
      VERIFICATION_PROVIDER_WEBHOOK_SECRET: ${VERIFICATION_PROVIDER_WEBHOOK_SECRET:-}
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../services:/app/services
      - ../../packages:/app/packages
      - ../../scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sync-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "scripts/sync_worker.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://fuxiaohe:fuxiaohe_dev@postgres:5432/fuxiaohe
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      SYNC_PROVIDER_URL: ${SYNC_PROVIDER_URL:-}
      SYNC_PROVIDER_API_KEY: ${SYNC_PROVIDER_API_KEY:-}
      SYNC_WORKER_INTERVAL_SECONDS: ${SYNC_WORKER_INTERVAL_SECONDS:-300}
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../services:/app/services
      - ../../packages:/app/packages
      - ../../scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "5173:5173"
    volumes:
      - ../../apps/web/src:/app/apps/web/src
    depends_on:
      - api

volumes:
  pgdata:
