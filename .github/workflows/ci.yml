name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ponytail: 排除 sentence-transformers（拉 torch，慢且 verify_core 用不到，embedding 走延迟 import + API 兜底）
          grep -viE '^sentence-transformers' requirements.txt > req-ci.txt
          pip install -r req-ci.txt

      - name: Self-test
        run: PYTHONPATH=. python scripts/verify_core.py

      - name: Backend contract tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run build
